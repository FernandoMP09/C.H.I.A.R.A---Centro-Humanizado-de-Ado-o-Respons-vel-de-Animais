<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Perfil da instituicao</title>
</head>

<body class="body-instituicao">
    <aside class="menu-lateral-instituicao">
        <div class="logo">
            <a href="../index.html">
                <img src="../imgs/chiara-logo.png" alt="Logo C.H.I.A.R.A">
                <span>C.H.I.A.R.A</span>
            </a>
        </div>
        <div class="btns-menu-lateral">
            <a href="dashbord-instituicao.html" class="btn-branco-dashboard">
                🌐Dashbord
            </a>

            <a href="animais-instituicao.html" class="btn-branco-dashboard">
                🐾Animais
            </a>

            <a href="cadastrar-animal-instituicao.html" class="btn-branco-dashboard">
                ➕Cadastrar animal
            </a>

            <a href="pedidos-instituicao.html" class="btn-branco-dashboard">
                📋Pedidos
            </a>
            <a href="agendamentos-instituicao.html" class="btn-branco-dashboard">
                📅Agendamentos
            </a>
            <a href="pos-adocao-instituicao.html" class="btn-branco-dashboard">
                ❤️Pós-adoção
            </a>

            <a href="perfil-instituicao.html" class="btn-azul-dashboard">
                🏢Perfil da instituição
            </a>

            <a href="../index.html" class="btn-branco-dashboard">
                🚪Sair
            </a>

        </div>
    </aside>
    <main>
        <div class="itens-main">
            <div class="cabecalho-perfil-instituicao">
                <h1>Perfil da Instituição</h1>
                <p>Estas informações são exibidas para os adotantes.</p>
            </div>
            <div class="card1-perfil-instituicao">
                <div class="icone-perfil-instituicao">
                    <h1>🏡</h1>
                </div>
                <div txt-card1-perfil-instituicao>
                    <h1>Abrigo Patas Felizes</h1>
                    <p>São Paulo, SP · desde 2014</p>
                </div>
            </div>
            <section class="card-form-cadastrar">
                <div class="grid">
                    <div class="campo">
                        <label for="nome-instituicao">Nome da Instituição</label>
                        <input type="text" id="nome-instituicao" placeholder="Abrigo Patas Felizes">
                    </div>
                    <div class="campo">
                        <label for="cnpj">CNPJ</label>
                        <input type="text" id="cnpj" placeholder="00.000.000/0001-00">
                    </div>
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="text" id="email" placeholder="contato@patasfelizes.org">
                    </div>
                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" placeholder="00000-0000">
                    </div>
                    <div class="pt2-form-perfil-instituicao">
                        <div class="campo">
                            <label for="endereco">Endereço</label>
                            <input type="text" id="endereco" placeholder="Rua, número, bairro, cidade">
                        </div>
                        <div class="campo-2-linhas">
                            <label for="sobre">Sobre a instituição</label>
                            <input type="text" id="sobre"
                                placeholder="Abrigo dedicado ao resgate, cuidado veterinário e adoção responsável de cães e gatos na região metropolitana de São Paulo.">
                        </div>
                    </div>
                </div>
                <div class="btn-salvar-alteracoes">
                    <a href="" class="btn-azul">Salvar alterações</a>
                </div>
            </section>
        </div>
